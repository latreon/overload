name: Release

# A `v*` tag builds the binaries and attaches them to the GitHub release.
# The pull request and manual triggers only build, to check this file.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the binary
        run: |
          lipo -archs target/${{ matrix.target }}/release/overload
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            target/${{ matrix.target }}/release/overload --help
          fi

      - name: Package
        run: |
          name=overload-${{ matrix.target }}
          mkdir dist
          tar -czf dist/$name.tar.gz -C target/${{ matrix.target }}/release overload -C "$PWD" LICENSE
          cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: overload-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release, or add the files to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi
