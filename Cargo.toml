[package]
name = "overload-tui"
version = "0.5.0"
edition = "2021"
description = "A macOS terminal tool to find and kill resource-hungry processes fast"
license = "MIT"
repository = "https://github.com/latreon/overload"
readme = "README.md"
keywords = ["tui", "process", "macos", "kill", "monitor"]
categories = ["command-line-utilities"]
exclude = ["docs/", "Formula/", ".github/", "CLAUDE.md"]

# The crate name `overload` is taken on crates.io. The command stays `overload`.
[[bin]]
name = "overload"
path = "src/main.rs"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
nix = { version = "0.29", features = ["signal", "process"] }
