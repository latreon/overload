[package]
name = "overload"
version = "0.4.0"
edition = "2021"
description = "A macOS terminal tool to find and kill resource-hungry processes fast"
license = "MIT"
repository = "https://github.com/latreon/overload"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
nix = { version = "0.29", features = ["signal", "process"] }
